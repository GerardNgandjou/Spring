spring:
  application:
    name: manage-users

  # Database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/management_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  session:
    store-type: jdbc

  # Hibernate properties
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
    check-template-location: true
    servlet:
      content-type: text/html
    enabled: true

    # Mail configuration - comment out or provide dummy values for development
    mail:
      host: localhost # smtp.gmail.com
      port: 12 # 587
      username: dummy # ${MAIL_USERNAME:}  # Leave empty for development
      password: dummy # ${MAIL_PASSWORD:}  # Leave empty for development
      protocol: smtp
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
              required: true
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000
      test-connection: false


server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
  port: 8082
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.example.manage_users: DEBUG
    org.springframework.security: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8405/eureka/
    register-with-eureka: true
    fetch-registry: true

app:
  jwt:
    secret: Your256BitSecretKeyForJwtSigningPleaseChangeInProduction
    access-expiration: 3600000  # 1 heure
    refresh-expiration: 2592000000  # 30 jours
    email-verification-expiration: 86400000  # 24 heures
    password-reset-expiration: 1800000  # 30 minutes
    email-change-expiration: 3600000  # 1 heure
  base-url: http://localhost:8082
  email:
    from: support@example.com