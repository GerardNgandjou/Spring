spring:
  application:
    name: manage-users

  # Database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/management_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  session:
    store-type: jdbc

  # Hibernate properties
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
  port: 8082
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG
    org.springframework.security: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8405/eureka/
    register-with-eureka: true
    fetch-registry: true