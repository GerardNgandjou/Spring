spring:
  application:
    name: system-manager-file
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/management_file
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  session:
    store-type: jdbc

  # Hibernate properties
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

file:
  upload-dir: ./upload

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8405/eureka/
    register-with-eureka: true
    fetch-registry: true
